<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Animal 广告买量对 DAU 影响分析</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:24px;background:#F2F6FF;color:#243558;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;letter-spacing:0}.page{width:min(1320px,100%);margin:0 auto;background:#FFFFFF;border-radius:16px;box-shadow:0 2px 12px rgba(30,60,120,.07);overflow:hidden}.hero{padding:28px 32px;color:#FFFFFF;background:linear-gradient(120deg,#1557E0 0%,#3B82F6 55%,#7AB8FF 100%)}h1{font-size:24px;line-height:1.35;margin:0 0 10px;letter-spacing:0}.meta{font-size:13px;line-height:1.8}.scope{margin:22px 32px 0;padding:14px 16px;background:#FFF8E1;border-left:5px solid #F59E0B;color:#7C4A03;border-radius:8px;line-height:1.7}.scope-label{display:inline-block;background:#FCD34D;color:#7C2D12;padding:3px 8px;border-radius:6px;margin:0 8px 5px 0;font-weight:700}.scope-row{display:block}.section{padding:0 32px 32px;scroll-margin-top:16px}.section-title{font-size:18px;color:#1A2B4A;border-left:5px solid #3B82F6;padding-left:10px;margin:24px 0 16px;letter-spacing:0}.section-separator{height:3px;background:#E2EAFF;margin:0 32px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kpi{padding:18px 20px;border-radius:14px;color:#FFFFFF;min-width:0;overflow-wrap:anywhere}.kpi:nth-child(1){background:linear-gradient(135deg,#1E60F0,#4F9DFF)}.kpi:nth-child(2){background:linear-gradient(135deg,#7C3AED,#A78BFA)}.kpi:nth-child(3){background:linear-gradient(135deg,#D97706,#FCD34D)}.kpi:nth-child(4){background:linear-gradient(135deg,#059669,#34D399)}.kpi-title{font-size:13px;line-height:1.4}.kpi-value{font-size:30px;font-weight:900;line-height:1.2;margin:6px 0}.kpi-detail{font-size:12px;line-height:1.5}.fallback-note{margin:9px 2px 0;color:#64748B;font-size:12px}.chartbox{background:#FFFFFF;border:1px solid #E2EAFF;border-radius:8px;margin-top:16px;overflow:hidden;min-width:0}.chart-head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 0;min-height:39px}.chart-heading{display:flex;align-items:center;gap:6px;min-width:0}.chart-title{min-width:0;color:#374151;font-size:14px;font-weight:700;line-height:1.4;margin:0;letter-spacing:0}.chart-actions{display:flex;align-items:center;gap:8px;flex:0 0 auto}.chart{width:100%;height:300px}.chart-main{height:340px}.charts2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}.info{width:22px;height:22px;border:0;border-radius:50%;background:#E2EAFF;color:#1D4ED8;font-size:14px;font-weight:800;cursor:pointer;flex:0 0 22px}.info:hover,.info:focus-visible,.info[aria-expanded="true"]{background:#1D4ED8;color:#FFFFFF}.chart-note{display:none;position:absolute;z-index:5;top:calc(100% + 6px);left:12px;max-width:min(360px,calc(100% - 24px));padding:9px 11px;border-radius:6px;background:#1A2B4A;color:#FFFFFF;box-shadow:0 6px 18px rgba(26,43,74,.2);font-size:12px;line-height:1.55}.chart-heading:hover .chart-note,.chart-heading:focus-within .chart-note,.chart-note.open{display:block}.toggle{display:flex;background:#F1F5FB;border-radius:7px;padding:3px;white-space:nowrap}.toggle button{border:0;background:transparent;padding:5px 9px;color:#475569;cursor:pointer}.toggle button.active{background:#FFFFFF;color:#1D4ED8}.cards{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:18px}.card{padding:14px 16px;background:#F8FAFF;border:1px solid #E2EAFF;border-radius:12px;line-height:1.65;overflow-wrap:anywhere}.badge{display:inline-block;padding:3px 8px;border-radius:6px;font-weight:700;margin-bottom:7px}.card:nth-child(1) .badge{background:#DBEAFE;color:#1D4ED8}.card:nth-child(2) .badge{background:#EDE9FE;color:#6D28D9}.card:nth-child(3) .badge{background:#FEF3C7;color:#B45309}.card:nth-child(4) .badge{background:#D1FAE5;color:#065F46}.analysis{background:#F8FAFF;border:1px solid #E2EAFF;border-radius:12px;padding:16px 18px;margin-top:16px;line-height:1.75}.analysis p{margin:10px 0;overflow-wrap:anywhere}.trend{display:inline-block;background:#DBEAFE;color:#1D4ED8;padding:5px 10px;border-radius:6px;font-weight:700}.advice{margin-top:14px;border-left:5px solid #3B82F6;padding:12px 14px;background:#F8FAFF;line-height:1.7;overflow-wrap:anywhere}.empty{padding:22px;background:#F8FAFF;border:1px solid #E2EAFF;border-radius:8px;color:#64748B}.layout{display:grid;grid-template-columns:150px minmax(0,1fr);gap:24px;max-width:1494px;margin:0 auto;align-items:stretch}.toc-shell{min-width:150px;background:#FFFFFF;border-right:2px solid #E2EAFF;border-radius:8px;align-self:stretch}.toc{position:sticky;top:24px;width:100%;padding:14px 10px;max-height:calc(100vh - 48px);overflow:auto}.toc-title{font-size:13px;color:#64748B;font-weight:700;padding:0 8px 8px}.toc a{display:block;color:#475569;text-decoration:none;border-left:3px solid transparent;padding:8px 8px;font-size:13px;line-height:1.3}.toc a.level-1{padding-left:20px;color:#64748B}.toc a.active{color:#1D4ED8;background:#F1F5FB;border-left-color:#3B82F6;font-weight:700}.layout-main{min-width:0}.layout-main .page{margin:0}.report-error{max-width:900px;margin:50px auto;padding:20px;background:#FFFFFF;border:1px solid #E2EAFF;border-radius:8px;color:#1A2B4A}
    @media(max-width:1000px){.layout{grid-template-columns:120px minmax(0,1fr);gap:12px}.toc-shell{min-width:120px}.section{padding-left:24px;padding-right:24px}.section-separator{margin-left:24px;margin-right:24px}.scope{margin-left:24px;margin-right:24px}}
    @media(max-width:800px){body{margin:0}.layout{display:block}.toc-shell{position:sticky;top:0;z-index:10;width:100%;min-width:0;border-right:0;border-bottom:2px solid #E2EAFF;border-radius:0}.toc{position:static;display:flex;width:100%;max-height:none;overflow-x:auto;padding:8px}.toc-title{display:none}.toc a,.toc a.level-1{white-space:nowrap;padding:7px 10px;border-left:0;border-bottom:3px solid transparent}.toc a.active{border-bottom-color:#3B82F6}.page{border-radius:0}.section{padding:0 16px 24px}.section-separator{margin:0 16px}.scope{margin:16px}.kpis,.cards,.charts2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kpi-value{font-size:23px}}
    @media(max-width:560px){.kpis,.cards,.charts2{grid-template-columns:minmax(0,1fr)}.hero{padding:22px 18px}.chart-head{align-items:flex-start}.chart-actions{align-items:center}.toggle button{padding:5px 7px}.chart,.chart-main{height:300px}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const REPORT_DATA=__REPORT_DATA_JSON__;
    const CHARTS=[];
    const CHART_OBSERVERS=[];
    const el=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node};
    const append=(parent,...children)=>{children.filter(Boolean).forEach(child=>parent.appendChild(child));return parent};
    const monthDay=value=>{const parts=value.split('-');return `${parts[1]}月${parts[2]}日`};
    const axisNumber=value=>{const number=Number(value);if(Math.abs(number)>=1e8)return `${Number((number/1e8).toFixed(2))}亿`;if(Math.abs(number)>=1e4)return `${Number((number/1e4).toFixed(2))}万`;return number};
    const tooltipNumber=value=>value==null?'':Number(value).toLocaleString('en-US');
    const tooltipPercent=value=>value==null?'':`${Number(value).toFixed(1)}%`;
    const rangeRows=(section,key)=>{const range=section.chart_ranges[key];return section.daily.filter(row=>row.date>=range.start&&row.date<=range.end)};
    const baseOption=rows=>({legend:{top:8,left:'center'},grid:{top:40,left:10,right:20,bottom:30,containLabel:true},tooltip:{trigger:'axis'},xAxis:{type:'category',data:rows.map(row=>row.date.slice(5))},yAxis:{type:'value',min:0,axisLabel:{formatter:axisNumber}}});
    const lineSeries=(name,data,color,yAxisIndex=0)=>({name,type:'line',data,yAxisIndex,smooth:true,showSymbol:false,lineStyle:{width:2.5,color}});

    function closeChartNotes(except){
      document.querySelectorAll('.chart-note').forEach(note=>{
        if(note===except)return;
        note.classList.remove('open');
        const trigger=document.querySelector(`[aria-controls="${note.id}"]`);
        if(trigger)trigger.setAttribute('aria-expanded','false');
      });
    }

    function chartBox(title,note,id,isMain=false){
      const box=el('div','chartbox');
      const head=el('div','chart-head');
      const headingGroup=el('div','chart-heading');
      const heading=el('h3','chart-title',title);
      const actions=el('div','chart-actions');
      const info=el('button','info','!');info.type='button';info.setAttribute('aria-label','查看图表口径说明');info.setAttribute('aria-expanded','false');
      const noteBox=el('div','chart-note',note);noteBox.id=`${id}-note`;noteBox.setAttribute('role','tooltip');info.setAttribute('aria-controls',noteBox.id);info.setAttribute('aria-describedby',noteBox.id);
      info.addEventListener('click',event=>{if(window.matchMedia('(hover:hover)').matches)return;event.stopPropagation();const shouldOpen=!noteBox.classList.contains('open');closeChartNotes(noteBox);noteBox.classList.toggle('open',shouldOpen);info.setAttribute('aria-expanded',String(shouldOpen))});
      append(headingGroup,heading,info,noteBox);append(head,headingGroup,actions);
      const chart=el('div',isMain?'chart chart-main':'chart');chart.id=id;
      append(box,head,chart);
      return {box,actions,chart};
    }

    function mountChart(element,option){
      const controller={instance:null,pending:[],setOption(update,options){if(this.instance)this.instance.setOption(update,options);else this.pending.push({update,options})}};
      requestAnimationFrame(()=>{
        if(!element.isConnected)return;
        const chart=echarts.init(element);chart.setOption(option);controller.instance=chart;controller.pending.forEach(({update,options})=>chart.setOption(update,options));controller.pending=[];CHARTS.push(chart);
        if(typeof ResizeObserver!=='undefined'){
          const observer=new ResizeObserver(()=>{if(element.clientWidth>0&&element.clientHeight>0)chart.resize()});observer.observe(element);CHART_OBSERVERS.push(observer);
        }
        requestAnimationFrame(()=>chart.resize());
      });
      return controller;
    }

    function renderCharts(section,index,parent){
      const dauRows=rangeRows(section,'dau');
      const main=chartBox(`${section.label} DAU 趋势`,'总 DAU = 广告 DAU + 自然 DAU',`chart-${index}-1`,true);
      const toggle=el('div','toggle');
      const barButton=el('button','active','柱状图');barButton.type='button';
      const lineButton=el('button','','趋势图');lineButton.type='button';
      append(toggle,barButton,lineButton);main.actions.insertBefore(toggle,main.actions.firstChild);append(parent,main.box);
      const mainOption=isLine=>({...baseOption(dauRows),
        yAxis:isLine?[{type:'value',min:0,axisLabel:{formatter:axisNumber}},{type:'value',min:0,axisLabel:{formatter:axisNumber}}]:{type:'value',min:0,axisLabel:{formatter:axisNumber}},
        series:isLine?[
          {...lineSeries('广告 DAU',dauRows.map(row=>row.ad_dau),'#1D4ED8'),tooltip:{valueFormatter:tooltipNumber}},
          {...lineSeries('自然 DAU',dauRows.map(row=>row.organic_dau),'#059669',1),tooltip:{valueFormatter:tooltipNumber}}
        ]:[
          {name:'广告 DAU',type:'bar',stack:'dau',data:dauRows.map(row=>row.ad_dau),itemStyle:{color:'#3B82F6'},tooltip:{valueFormatter:tooltipNumber}},
          {name:'自然 DAU',type:'bar',stack:'dau',data:dauRows.map(row=>row.organic_dau),itemStyle:{color:'#34D399'},tooltip:{valueFormatter:tooltipNumber}}
        ]
      });
      const mainChart=mountChart(main.chart,mainOption(false));
      const switchMode=isLine=>{
        barButton.classList.toggle('active',!isLine);lineButton.classList.toggle('active',isLine);
        mainChart.setOption(mainOption(isLine),{notMerge:true});
      };
      barButton.addEventListener('click',()=>switchMode(false));lineButton.addEventListener('click',()=>switchMode(true));

      const grid=el('div','charts2');append(parent,grid);
      const shareRows=rangeRows(section,'share');
      const share=chartBox(`${section.label} 广告用户占 DAU 比例`,'广告占比 = 广告 DAU / 总 DAU',`chart-${index}-2`);append(grid,share.box);
      mountChart(share.chart,{...baseOption(shareRows),yAxis:{type:'value',axisLabel:{formatter:'{value}%'}},series:[{...lineSeries('广告占比',shareRows.map(row=>row.ad_share),'#D97706'),areaStyle:{color:'rgba(217,119,6,0.08)'},tooltip:{valueFormatter:tooltipPercent}}]});

      const newRows=rangeRows(section,'new_users');
      const added=chartBox(`${section.label} 每日新增`,'每日广告新增与自然新增',`chart-${index}-3`);append(grid,added.box);
      mountChart(added.chart,{...baseOption(newRows),series:[
        {name:'广告新增',type:'bar',data:newRows.map(row=>row.ad_new),itemStyle:{color:'#3B82F6'},tooltip:{valueFormatter:tooltipNumber}},
        {name:'自然新增',type:'bar',data:newRows.map(row=>row.organic_new),itemStyle:{color:'#34D399'},tooltip:{valueFormatter:tooltipNumber}}
      ]});

      const costRows=rangeRows(section,'dau_cost');
      const dauCost=chartBox(`${section.label} 总DAU VS 广告消耗`,'总 DAU = 广告 DAU + 自然 DAU；广告消耗为媒体折后成本',`chart-${index}-4`);append(grid,dauCost.box);
      mountChart(dauCost.chart,{...baseOption(costRows),yAxis:[{type:'value',min:0,axisLabel:{formatter:axisNumber}},{type:'value',min:0,axisLabel:{formatter:axisNumber}}],series:[
        {name:'总 DAU',type:'bar',data:costRows.map(row=>row.total_dau),itemStyle:{color:'#8B5CF6',opacity:.75},tooltip:{valueFormatter:tooltipNumber}},
        {...lineSeries('广告消耗',costRows.map(row=>row.ad_cost),'#F43F5E',1),tooltip:{valueFormatter:tooltipNumber}}
      ]});

      const shareCostRows=rangeRows(section,'share_cost');
      const shareCost=chartBox(`${section.label} 广告消耗 VS 广告占比`,'广告占比 = 广告 DAU / 总 DAU；广告消耗为媒体折后成本',`chart-${index}-5`);append(grid,shareCost.box);
      mountChart(shareCost.chart,{...baseOption(shareCostRows),yAxis:[{type:'value',axisLabel:{formatter:'{value}%'}},{type:'value',min:0,axisLabel:{formatter:axisNumber}}],series:[
        {...lineSeries('广告占比',shareCostRows.map(row=>row.ad_share),'#D97706'),tooltip:{valueFormatter:tooltipPercent}},
        {...lineSeries('广告消耗',shareCostRows.map(row=>row.ad_cost),'#F43F5E',1),tooltip:{valueFormatter:tooltipNumber}}
      ]});
    }

    function renderSection(section,index){
      const block=el('section','section');block.id=`section-${section.id}`;
      append(block,el('h2','section-title',section.label));
      if(section.status==='empty'){
        append(block,el('div','empty',section.empty_message));return block;
      }
      const kpis=el('div','kpis');
      section.kpis.forEach(item=>{
        const card=el('div','kpi');
        append(card,el('div','kpi-title',`${item.title} · ${monthDay(section.kpi_date)}`),el('div','kpi-value',item.value),el('div','kpi-detail',item.detail));
        append(kpis,card);
      });
      append(block,kpis);
      if(section.kpi_fallback_note)append(block,el('div','fallback-note',section.kpi_fallback_note));
      renderCharts(section,index,block);
      const cards=el('div','cards');
      section.cards.forEach(item=>{const card=el('div','card');append(card,el('span','badge',item.title),el('div','',item.body));append(cards,card)});
      append(block,cards);
      const analysis=el('div','analysis');append(analysis,el('span','trend',section.trend.tag));
      section.trend.paragraphs.forEach((text,index)=>append(analysis,el('p','',`${index+1}. ${text}`)));
      append(block,analysis);
      const advice=el('div','advice');append(advice,el('strong','','投放建议：'),document.createTextNode(section.trend.recommendation));append(block,advice);
      return block;
    }

    function renderReport(){
      document.title=REPORT_DATA.metadata.title;
      const page=el('main','page');
      const hero=el('header','hero');
      append(hero,el('h1','',REPORT_DATA.metadata.title),el('div','meta',`数据时间范围：${REPORT_DATA.metadata.data_start}~${REPORT_DATA.metadata.data_end}`),el('div','meta',`报告产出时间：${REPORT_DATA.metadata.generated_date}　产出用户：${REPORT_DATA.metadata.user}`));
      append(page,hero);
      const scope=el('div','scope');append(scope,el('span','scope-label','口径说明'));
      REPORT_DATA.caliber.forEach(item=>append(scope,el('span','scope-row',`${item.ports}：${item.rule}`)));append(page,scope);
      REPORT_DATA.sections.forEach((section,index)=>{append(page,renderSection(section,index));if(index<REPORT_DATA.sections.length-1)append(page,el('div','section-separator'))});
      const app=document.getElementById('app');
      if(REPORT_DATA.sections.length===1){append(app,page);return}
      const layout=el('div','layout');const tocShell=el('aside','toc-shell');const toc=el('nav','toc');toc.setAttribute('aria-label','报告目录');append(toc,el('div','toc-title','报告目录'));
      REPORT_DATA.sections.forEach(section=>{const link=el('a',section.nav_level===1?'level-1':'',section.label);link.href=`#section-${section.id}`;link.dataset.target=`section-${section.id}`;append(toc,link)});
      append(tocShell,toc);const main=el('div','layout-main');append(main,page);append(layout,tocShell,main);append(app,layout);
      const links=[...toc.querySelectorAll('a')];
      const observer=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting){links.forEach(link=>link.classList.toggle('active',link.dataset.target===entry.target.id))}})},{rootMargin:'-15% 0px -70% 0px'});
      REPORT_DATA.sections.forEach(section=>observer.observe(document.getElementById(`section-${section.id}`)));
      if(links[0])links[0].classList.add('active');
    }

    try{renderReport();window.addEventListener('resize',()=>CHARTS.forEach(chart=>chart.resize()));document.addEventListener('click',()=>closeChartNotes());document.addEventListener('keydown',event=>{if(event.key==='Escape')closeChartNotes()})}catch(error){const box=el('div','report-error','报告渲染失败，请检查结构化报告数据。');document.getElementById('app').replaceChildren(box);console.error(error)}
  </script>
</body>
</html>
